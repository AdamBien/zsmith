# zsmith configuration for the benchmarks in this directory.
#
# Loaded because the benchmark scripts run with benchmarks/ as their working directory, and
# ./app.properties overrides ~/.zsmith/app.properties. A system property still outranks this file,
# which is how benchmarkLightmetalModels selects a model per run. Per-benchmark overrides go one
# level deeper: pointer-chaser/, parallel-worker/ or error-recoverer/.

# Match max-tokens in ~/.lightmetal/app.properties.
#
# zsmith always writes max_tokens into the request payload, and lightmetal prefers the payload over
# its own configuration — so without this line every run is capped at zsmith's 4096 default and the
# 8192 configured for lightmetal never applies. A model that narrates its way through a long pointer
# chase then gets truncated mid-answer and scores a FAIL it did not earn.
lightmetal.max.tokens=8192
